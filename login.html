<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login or create an account at Shahid & Afaq Mobiles." />
    <title>Login | Shahid & Afaq Mobiles</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="pages.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="auth-body">

    <!-- Floating background blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Back to Home -->
    <a href="index.html" class="back-home">
        <i class="fas fa-arrow-left"></i> Back to Shahid & Afaq Mobiles
    </a>

    <main class="auth-main">
        <div class="auth-card">

            <!-- Logo -->
            <div style="text-align: center; margin-bottom: 1rem;">
                <img src="images/sa_mobiles_logo.png" alt="Shahid & Afaq Mobiles" style="height:80px; margin-bottom:10px;" />
            </div>
            <div class="auth-logo">Shahid & Afaq Mobiles</div>
            <p class="auth-tagline">Premium shopping, personalized for you</p>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="login-tab" onclick="switchTab('login')">Sign In</button>
                <button class="auth-tab" id="register-tab" onclick="switchTab('register')">Sign Up</button>
                <div class="tab-indicator" id="tab-indicator"></div>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active-form" novalidate>
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="login-email" placeholder="john@example.com" required />
                    </div>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="login-password" placeholder="••••••••" required />
                        <button type="button" class="toggle-password" onclick="togglePass('login-password', this)" aria-label="Toggle password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me" /> Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                <div class="auth-divider"><span>or continue with</span></div>
                <div class="social-auth">
                    <button type="button" class="social-auth-btn" id="google-btn">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button type="button" class="social-auth-btn" id="facebook-btn">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </button>
                </div>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-fname">First Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="reg-fname" placeholder="John" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="reg-lname">Last Name</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="reg-lname" placeholder="Doe" required />
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="reg-email" placeholder="john@example.com" required />
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="reg-password" placeholder="Create a strong password" required />
                        <button type="button" class="toggle-password" onclick="togglePass('reg-password', this)" aria-label="Toggle password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-confirm">Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-shield-alt input-icon"></i>
                        <input type="password" id="reg-confirm" placeholder="Repeat your password" required />
                    </div>
                </div>
                <label class="checkbox-label" style="margin-bottom:1.2rem;">
                    <input type="checkbox" id="agree-terms" required />
                    I agree to the <a href="#" class="forgot-link">Terms &amp; Privacy Policy</a>
                </label>
                <button type="submit" class="btn btn-primary btn-full" id="register-btn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
                <div class="auth-divider"><span>or sign up with</span></div>
                <div class="social-auth">
                    <button type="button" class="social-auth-btn" id="google-reg-btn">
                        <i class="fab fa-google"></i> Google
                    </button>
                    <button type="button" class="social-auth-btn" id="facebook-reg-btn">
                        <i class="fab fa-facebook-f"></i> Facebook
                    </button>
                </div>
            </form>

        </div>
    </main>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');
            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');
            const indicator = document.getElementById('tab-indicator');

            if (tab === 'login') {
                loginForm.classList.add('active-form');
                registerForm.classList.remove('active-form');
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                indicator.style.transform = 'translateX(0)';
            } else {
                registerForm.classList.add('active-form');
                loginForm.classList.remove('active-form');
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                indicator.style.transform = 'translateX(100%)';
            }
        }

        function togglePass(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in…';
            btn.disabled = true;
            setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        });

        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;
            if (password !== confirm) {
                alert('Passwords do not match!');
                return;
            }
            const btn = document.getElementById('register-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account…';
            btn.disabled = true;
            setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        });
    </script>

</body>
</html>
